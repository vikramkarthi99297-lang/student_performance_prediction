{% extends 'base.html' %}
{% block content %}
<div class="login">
  <div class="login-art">
    <i class="fa-solid fa-graduation-cap"></i>
    <h1>Student Performance<br>Prediction System</h1>
    <img src="{{ url_for('static', filename='images/db.jpeg') }}">
    <h3>DB jain college<h3>
    <p>Administrator Login</p>
    <p class="muted">Marks, attendance and academic performance management</p>
  </div>
  <form class="card" method="post">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
    <h2>Welcome back</h2>
    <p>Sign in to the administrator dashboard</p>
    <label>Admin email or username
      <input name="identity" required autofocus autocomplete="username" placeholder="Example: admin@college.edu">
    </label>
    <label>Password
      <span class="show" onclick="togglePass()">Show</span>
      <input id="password" name="password" type="password" required autocomplete="current-password" placeholder="Enter your password">
    </label>
    <label class="check"><input type="checkbox" name="remember"> Remember me</label>
    <button class="primary" type="submit">Login <i class="fa fa-arrow-right"></i></button>
    <a href="{{ url_for('forgot_password') }}">Forgot password?</a>
  </form>
</div>
{% endblock %}
